name: Solar System Workflow

on: 
  workflow_dispatch:
  push:
    branches:
      - main
      - 'feature/*'

env:
    MONGO_URI: mongodb+srv://supercluster.d83jj.mongodb.net/superData
    MONGO_USERNAME: superuser
    MONGO_PASSWORD: ${{ secrets.MONGO_PASSWORD }}
    
jobs:
    unit-testing:
        name: Unit Testing
        runs-on: ubuntu-latest
        container:
           image: node:20
           
        steps:
        - name: Checkout Repository
          uses: actions/checkout@v4

        #- name: Setup NodeJS Version
        #  uses: actions/setup-node@v4
        #  with:
        #    node-version: 20
    
        - name: Install Dependencies
          run: npm install
    
        - name: Unit Testing
          run: npm test

        - name: Cache NPM dependencies  
          uses: actions/cache@v4
          with:
              path: ~/.npm
              key: '${{ runner.os }}-node-modules-${{ hashFiles(''package-lock.json'') }}'
          
        - name: Archive Test Result
          if: always()
          uses: actions/upload-artifact@v4
          with:
            name: Mocha-Test-Result
            path: test-results.xml



    Code-Coverage:
       runs-on: ubuntu-latest
       steps:
       - name: checkout the repository
         uses: actions/checkout@v4

       - name: setup NodeJS of version 18              
         uses: actions/setup-node@v4 
         with: 
           node-version: 18

       - name: Run Code-coverage
         run: npm run code-coverage
         continue-on-error: true

       - name: Upload code-coverage reports
         uses: actions/upload-artifact@v4
         with:
           name: Code-Coverage-Result
           path: coverage
           retention-days: 5   


    docker:
      runs-on: ubuntu-latest
      needs: [unit-testing, code-coverage]
      permissions:
         packages: write  
      steps:
        - name: checkout the repository
          uses: actions/checkout@v4 

        - name: docker login
          uses: docker/login-action@v3
          with:
            registry: ghcr.io
            username: ${{github.repository_owner}}
            password: ${{secrets.GITHUB_TOKEN}}     

        - name: docker build and push to github 
          uses: docker/build-push-action@v6
          with:
            context: .
            push: true
            tags: 'ghcr.io/${{ github.repository_owner }}/solar-system:${{ github.sha }}' 
            
        - name: Login to Docker Hub
          uses: docker/login-action@v3
          with:
            username: ${{ secrets.DOCKERHUB_USERNAME }}
            password: ${{ secrets.DOCKERHUB_TOKEN }}

        - name: Build and push Docker image to dockerhub
          uses: docker/build-push-action@v6
          with:
            context: .
            push: true
            tags: ${{ secrets.DOCKERHUB_USERNAME }}/solar-system:${{ github.sha }}   

    dev-deploy:
      needs: docker        
      runs-on: ubuntu-latest
      steps:
        - name: checkout the repository
          uses: actions/checkout@v4 

        - name: install kubectl CLI
          uses: azure/setup-kubectl@v3 
          with:
            version: 'v1.26.0'


        
        - name: Configure kubeconfig
          run: |
            mkdir -p ~/.kube
            echo "${{ secrets.KUBECONFIG }}" > ~/.kube/config
            chmod 600 ~/.kube/config    

        # - name: Get CCE cluster credentials
        #   uses: huaweicloud/cce-credential-action@v1.0.0
        #   with:
        #     ak: ${{ secrets.HUAWEI_ACCESS_KEY }}
        #     sk: ${{ secrets.HUAWEI_SECRET_KEY }}
        #     region: "eu-west-0"
        #     project_id: ${{ secrets.HUAWEI_PROJECT_ID }}
        #     cluster_id: ${{ secrets.HUAWEI_CLUSTER_ID }}    

        - name: featch kubernetes cluster details 
          run: |
            kubectl version --short    
            echo ---------------------------
            kubectl get nodes 